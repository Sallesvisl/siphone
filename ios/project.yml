name: PadBridge
options:
  bundleIdPrefix: com.sallesvisl
  deploymentTarget:
    iOS: '16.0'
targets:
  PadBridge:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sallesvisl.padbridge
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: PadBridge
        MARKETING_VERSION: '0.2.0'
        CURRENT_PROJECT_VERSION: 2
        CODE_SIGNING_ALLOWED: NO
    scheme:
      gatherCoverageData: false

